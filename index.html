<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Sorpresa de Aniversario ✨</title>

  <!-- Three.js + GLTFLoader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <!-- Confeti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --color-beige-bg: #f9f7f2;
      --color-oliva-suave: #87986a;
      --color-oliva-oscuro: #4a5c29;
      --color-dorado: #c5a059;
      --color-dorado-brillo: #dfc285;
      --color-blanco: #ffffff;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Poppins', system-ui, -apple-system, sans-serif;
      background: transparent;
    }

    /* Video de la cámara de fondo: 100% visible sin pantalla negra */
    #camera-feed {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
      background: #202020;
    }

    /* Canvas 3D transparente superpuesto a la cámara */
    #three-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: auto;
      background: transparent;
    }

    /* Mensaje flotante sin fondo (Emerge de adentro del cofre) */
    .mensaje-flotante-container {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      z-index: 25;
      pointer-events: none;
      text-align: center;
      width: 92%;
      max-width: 380px;
      top: 24%;
      display: none;
    }

    .mensaje-flotante-container.animar {
      display: block;
      animation: emergerDelCofre 1.1s cubic-bezier(0.19, 1, 0.22, 1) forwards;
    }

    .texto-titulo {
      font-family: 'Playfair Display', serif;
      font-size: 34px;
      font-weight: 700;
      color: var(--color-blanco);
      text-shadow: 
        0 0 12px rgba(197, 160, 89, 0.9), 
        0 0 25px rgba(135, 152, 106, 0.8), 
        0 3px 8px rgba(0,0,0,0.85);
      letter-spacing: -0.5px;
      line-height: 1.15;
      margin-bottom: 6px;
    }

    .texto-subtitulo {
      font-size: 21px;
      font-weight: 700;
      color: var(--color-dorado-brillo);
      text-shadow: 
        0 0 10px rgba(74, 92, 41, 0.9), 
        0 2px 6px rgba(0,0,0,0.85);
      line-height: 1.3;
    }

    @keyframes emergerDelCofre {
      0% {
        opacity: 0;
        transform: translate(-50%, 50px) scale(0.3);
      }
      60% {
        opacity: 1;
        transform: translate(-50%, -10px) scale(1.06);
      }
      100% {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
      }
    }

    /* Botones Inferiores */
    .bottom-ui {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 90%;
      max-width: 380px;
    }

    /* Botón Abrir: Elegante en Verde Oliva, Blanco y Dorado */
    .btn-abrir {
      background: linear-gradient(135deg, var(--color-oliva-suave) 0%, var(--color-oliva-oscuro) 100%);
      color: var(--color-blanco);
      border: 2px solid var(--color-dorado-brillo);
      padding: 16px 44px;
      font-size: 18px;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(74, 92, 41, 0.5), 0 0 15px rgba(223, 194, 133, 0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
      width: 100%;
    }

    .btn-abrir:active {
      transform: scale(0.97);
    }

    .btn-abrir::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.4) 50%, transparent 60%);
      transform: rotate(45deg);
      animation: brillo 3s infinite;
    }

    @keyframes brillo {
      0% { transform: translateX(-100%) rotate(45deg); }
      100% { transform: translateX(100%) rotate(45deg); }
    }

    /* Segundo Botón Sorpresa: Blanco marfil con bordes dorados */
    .btn-sorpresa {
      background: #ffffff;
      color: var(--color-oliva-oscuro);
      border: 2px solid var(--color-dorado);
      padding: 16px 24px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.35), 0 0 18px rgba(197, 160, 89, 0.4);
      display: none;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      text-decoration: none;
      animation: popInBounce 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .btn-sorpresa:hover {
      background: #fbf9f5;
    }

    @keyframes popInBounce {
      0% { opacity: 0; transform: translateY(25px) scale(0.85); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Pantalla de carga / Solicitud de permiso de cámara */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: #fbf9f5;
      z-index: 999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: var(--color-oliva-oscuro);
      padding: 24px;
      text-align: center;
      transition: opacity 0.5s ease;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(135, 152, 106, 0.2);
      border-top-color: var(--color-oliva-oscuro);
      border-radius: 50%;
      animation: spin 1s infinite linear;
      margin-bottom: 16px;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .btn-permiso-camara {
      margin-top: 18px;
      background: var(--color-oliva-suave);
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Pantalla de carga con soporte de activación de cámara -->
  <div id="loading" class="loading-overlay">
    <div class="spinner" id="spinner"></div>
    <p id="loading-txt" style="font-weight: 600; font-size: 16px;">Iniciando cámara y Realidad Aumentada...</p>
    <button id="btn-permiso" class="btn-permiso-camara" onclick="iniciarCamaraManual()">📷 Activar Cámara</button>
  </div>

  <!-- Video real de la cámara trasera -->
  <video id="camera-feed" autoplay playsinline muted></video>

  <!-- Canvas 3D -->
  <canvas id="three-canvas"></canvas>

  <!-- Mensaje flotante sin fondo emergente -->
  <div class="mensaje-flotante-container" id="mensaje-flotante">
    <div class="texto-titulo">¡Feliz Aniversario!</div>
    <div class="texto-subtitulo">Te amo mucho ❤️</div>
  </div>

  <!-- Botones Inferiores -->
  <div class="bottom-ui">
    <button class="btn-abrir" id="btn-abrir">
      <span>✨</span>
      <span>Abrir Cofre</span>
      <span>🔓</span>
    </button>

    <a href="./carta.html" class="btn-sorpresa" id="btn-sorpresa">
      <span>💌</span>
      <span>Esto no es todo, otro pequeño detalle...</span>
      <span>👉</span>
    </a>
  </div>

  <script>
    const loadingScreen = document.getElementById('loading');
    const loadingTxt = document.getElementById('loading-txt');
    const btnPermiso = document.getElementById('btn-permiso');
    const video = document.getElementById('camera-feed');
    const canvas = document.getElementById('three-canvas');
    const btnAbrir = document.getElementById('btn-abrir');
    const btnSorpresa = document.getElementById('btn-sorpresa');
    const mensajeFlotante = document.getElementById('mensaje-flotante');

    let scene, camera, renderer, mixer, clock, chestModel;
    let cofreAbierto = false;
    let camaraIniciada = false;

    // 1. Iniciar cámara trasera garantizando compatibilidad total en iOS Safari y Android Chrome
    async function startCamera() {
      if (camaraIniciada) return;
      try {
        const constraints = {
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        };

        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        video.setAttribute('playsinline', 'true');
        video.setAttribute('webkit-playsinline', 'true');
        await video.play();
        camaraIniciada = true;
      } catch (err) {
        console.warn('Error al iniciar cámara automáticamente:', err);
        loadingTxt.innerText = "Toca para permitir acceso a la cámara:";
        btnPermiso.style.display = 'block';
      }
    }

    async function iniciarCamaraManual() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' }
        });
        video.srcObject = stream;
        video.setAttribute('playsinline', 'true');
        await video.play();
        camaraIniciada = true;
        btnPermiso.style.display = 'none';
        loadingTxt.innerText = "Cámara activada con éxito.";
      } catch (e) {
        alert("Por favor permite el acceso a la cámara en los ajustes de tu navegador para ver la Realidad Aumentada.");
      }
    }

    // 2. Iniciar Three.js
    function initThree() {
      clock = new THREE.Clock();
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 0, 5.2);

      renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        alpha: true,
        antialias: true
      });
      renderer.setClearColor(0x000000, 0); // Fondo 100% transparente
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.outputEncoding = THREE.sRGBEncoding;

      // Iluminación cálida dorada
      const ambientLight = new THREE.AmbientLight(0xfff7e6, 2.2);
      scene.add(ambientLight);

      const dirLight1 = new THREE.DirectionalLight(0xfff3db, 2.5);
      dirLight1.position.set(2, 4, 3);
      scene.add(dirLight1);

      const dirLight2 = new THREE.DirectionalLight(0xdfc285, 1.4);
      dirLight2.position.set(-2, -1, 2);
      scene.add(dirLight2);

      // Cargar cofre.glb
      const loader = new THREE.GLTFLoader();
      loader.load('./cofre.glb', (gltf) => {
        chestModel = gltf.scene;

        const box = new THREE.Box3().setFromObject(chestModel);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());

        const maxDim = Math.max(size.x, size.y, size.z);
        const targetSize = 1.45;
        const scaleFactor = targetSize / maxDim;

        chestModel.scale.setScalar(scaleFactor);
        
        chestModel.position.x = -center.x * scaleFactor;
        chestModel.position.y = (-center.y * scaleFactor) - 0.45;
        chestModel.position.z = -center.z * scaleFactor;

        chestModel.rotation.x = 0.22;
        chestModel.rotation.y = 0;

        scene.add(chestModel);

        if (gltf.animations && gltf.animations.length > 0) {
          mixer = new THREE.AnimationMixer(chestModel);
          const clip = THREE.AnimationClip.findByName(gltf.animations, 'Scene') || gltf.animations[0];
          const action = mixer.clipAction(clip);
          action.setLoop(THREE.LoopOnce);
          action.clampWhenFinished = true;
          // VELOCIDAD DE APERTURA: 2.2x para abrirse rápido y dinámico
          action.timeScale = 2.2;
          window.chestAction = action;
        }

        // Ocultar pantalla de carga
        setTimeout(() => {
          loadingScreen.style.opacity = '0';
          setTimeout(() => loadingScreen.style.display = 'none', 450);
        }, 500);

      }, (xhr) => {
        if (xhr.lengthComputable) {
          const percent = Math.round((xhr.loaded / xhr.total) * 100);
          loadingTxt.innerText = `Cargando cofre en el aire (${percent}%)...`;
        }
      }, (err) => {
        console.error('Error al cargar cofre:', err);
      });

      window.addEventListener('resize', onWindowResize);
      setupTouchControls();
      animate();
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    let isDragging = false;
    let previousTouchX = 0;

    function setupTouchControls() {
      window.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          isDragging = true;
          previousTouchX = e.touches[0].clientX;
        }
      });

      window.addEventListener('touchmove', (e) => {
        if (isDragging && chestModel && e.touches.length === 1) {
          const deltaX = e.touches[0].clientX - previousTouchX;
          chestModel.rotation.y += deltaX * 0.008;
          previousTouchX = e.touches[0].clientX;
        }
      });

      window.addEventListener('touchend', () => {
        isDragging = false;
      });
    }

    // Balanceo 3D sutil para dar volumen sin girar 360
    let swingTime = 0;
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (mixer) mixer.update(delta);

      if (chestModel) {
        swingTime += delta * 1.5;
        if (!isDragging && !cofreAbierto) {
          chestModel.rotation.y = Math.sin(swingTime) * 0.14;
        }
      }

      renderer.render(scene, camera);
    }

    // Confeti elegante dorado, oliva y blanco
    function dispararConfeti() {
      const end = Date.now() + (3.2 * 1000);
      const colors = ['#c5a059', '#dfc285', '#87986a', '#ffffff', '#e8d5b5'];

      (function frame() {
        confetti({
          particleCount: 7,
          angle: 90,
          spread: 70,
          origin: { x: 0.5, y: 0.6 },
          colors: colors
        });
        confetti({
          particleCount: 5,
          angle: 60,
          spread: 55,
          origin: { x: 0.1, y: 0.7 },
          colors: colors
        });
        confetti({
          particleCount: 5,
          angle: 120,
          spread: 55,
          origin: { x: 0.9, y: 0.7 },
          colors: colors
        });

        if (Date.now() < end) {
          requestAnimationFrame(frame);
        }
      }());
    }

    // Botón Abrir Cofre
    btnAbrir.addEventListener('click', () => {
      if (!cofreAbierto) {
        cofreAbierto = true;

        if (chestModel) {
          chestModel.rotation.y = 0;
        }

        // 1. Abrir con velocidad rápida (timeScale: 2.2)
        if (window.chestAction) {
          window.chestAction.play();
        }

        // 2. Ocultar inmediatamente el botón "Abrir Cofre"
        btnAbrir.style.display = 'none';

        // 3. A los 850ms (cuando termina de levantarse la tapa rápido): emerge el mensaje y confeti
        setTimeout(() => {
          mensajeFlotante.classList.add('animar');
          dispararConfeti();
        }, 850);

        // 4. A los 2.3 segundos: aparece el segundo botón del detalle
        setTimeout(() => {
          btnSorpresa.style.display = 'flex';
        }, 2300);
      }
    });

    startCamera();
    initThree();
  </script>
</body>
</html>
