<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Sorpresa de Aniversario ❤️</title>

  <!-- Three.js + GLTFLoader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <!-- Confeti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Poppins', system-ui, -apple-system, sans-serif;
      background: #000;
    }

    /* Video de la cámara de fondo */
    #camera-feed {
      position: fixed;
      top: 50%;
      left: 50%;
      min-width: 100%;
      min-height: 100%;
      width: auto;
      height: auto;
      transform: translate(-50%, -50%);
      z-index: 1;
      object-fit: cover;
    }

    /* Canvas 3D */
    #three-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: auto;
    }

    /* Mensaje flotante sin fondo (Emerge de adentro del cofre) */
    .mensaje-flotante-container {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      z-index: 25;
      pointer-events: none;
      text-align: center;
      width: 92%;
      max-width: 380px;
      top: 26%;
      display: none;
    }

    .mensaje-flotante-container.animar {
      display: block;
      animation: emergerDelCofre 1.3s cubic-bezier(0.19, 1, 0.22, 1) forwards;
    }

    .texto-titulo {
      font-size: 32px;
      font-weight: 900;
      color: #fff;
      text-shadow: 
        0 0 10px #ff2a6d, 
        0 0 20px #ff2a6d, 
        0 0 40px #ff0055, 
        0 3px 6px rgba(0,0,0,0.9);
      letter-spacing: -0.5px;
      line-height: 1.15;
      margin-bottom: 6px;
    }

    .texto-subtitulo {
      font-size: 20px;
      font-weight: 700;
      color: #ffeaa7;
      text-shadow: 
        0 0 8px #ff7675, 
        0 0 16px #d63031, 
        0 2px 5px rgba(0,0,0,0.9);
      line-height: 1.3;
    }

    @keyframes emergerDelCofre {
      0% {
        opacity: 0;
        transform: translate(-50%, 60px) scale(0.3);
      }
      60% {
        opacity: 1;
        transform: translate(-50%, -15px) scale(1.08);
      }
      100% {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
      }
    }

    /* Botones Inferiores */
    .bottom-ui {
      position: fixed;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      width: 90%;
      max-width: 360px;
    }

    .btn-abrir {
      background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
      color: white;
      border: none;
      padding: 16px 44px;
      font-size: 19px;
      font-weight: 800;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(255, 65, 108, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
      width: 100%;
    }

    .btn-abrir:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 14px 35px rgba(255, 65, 108, 0.65);
    }

    .btn-abrir:active {
      transform: translateY(1px) scale(0.98);
    }

    .btn-abrir::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.4) 50%, transparent 60%);
      transform: rotate(45deg);
      animation: brillo 2.8s infinite;
    }

    @keyframes brillo {
      0% { transform: translateX(-100%) rotate(45deg); }
      100% { transform: translateX(100%) rotate(45deg); }
    }

    /* Segundo Botón Sorpresa: "Esto no es todo..." */
    .btn-sorpresa {
      background: linear-gradient(135deg, #a55eea 0%, #ff416c 100%);
      color: white;
      border: none;
      padding: 15px 24px;
      font-size: 16px;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(165, 94, 234, 0.5);
      display: none;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      text-decoration: none;
      animation: popInBounce 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .btn-sorpresa:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 14px 35px rgba(165, 94, 234, 0.65);
    }

    @keyframes popInBounce {
      0% { opacity: 0; transform: translateY(25px) scale(0.85); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Pantalla de carga */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: #0d0f17;
      z-index: 999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      transition: opacity 0.5s ease;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(255, 255, 255, 0.15);
      border-top-color: #ff4757;
      border-radius: 50%;
      animation: spin 1s infinite linear;
      margin-bottom: 16px;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <!-- Pantalla de carga -->
  <div id="loading" class="loading-overlay">
    <div class="spinner"></div>
    <p id="loading-txt" style="font-weight: 600;">Cargando cofre en el aire...</p>
  </div>

  <!-- Video real de la cámara trasera -->
  <video id="camera-feed" autoplay playsinline muted></video>

  <!-- Canvas 3D -->
  <canvas id="three-canvas"></canvas>

  <!-- Mensaje flotante sin fondo (Emerge de adentro del cofre) -->
  <div class="mensaje-flotante-container" id="mensaje-flotante">
    <div class="texto-titulo">¡Feliz Aniversario!</div>
    <div class="texto-subtitulo">Te amo mucho ❤️</div>
  </div>

  <!-- Botones Inferiores -->
  <div class="bottom-ui">
    <!-- Botón Abrir Cofre -->
    <button class="btn-abrir" id="btn-abrir">
      <span>✨</span>
      <span id="btn-texto">Abrir Cofre</span>
      <span>🔓</span>
    </button>

    <!-- Botón Segundo Detalle (Aparece a los 2.5 seg tras abrir) -->
    <a href="./carta.html" class="btn-sorpresa" id="btn-sorpresa">
      <span>💌</span>
      <span>Esto no es todo, otro pequeño detalle...</span>
      <span>👉</span>
    </a>
  </div>

  <script>
    const loadingScreen = document.getElementById('loading');
    const loadingTxt = document.getElementById('loading-txt');
    const video = document.getElementById('camera-feed');
    const canvas = document.getElementById('three-canvas');
    const btnAbrir = document.getElementById('btn-abrir');
    const btnTexto = document.getElementById('btn-texto');
    const btnSorpresa = document.getElementById('btn-sorpresa');
    const mensajeFlotante = document.getElementById('mensaje-flotante');

    let scene, camera, renderer, mixer, clock, chestModel;
    let cofreAbierto = false;

    // 1. Iniciar cámara trasera
    async function startCamera() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });
        video.srcObject = stream;
        await video.play();
      } catch (err) {
        console.warn('Cámara no disponible:', err);
        document.body.style.background = 'radial-gradient(circle at center, #240b36 0%, #000000 100%)';
      }
    }

    // 2. Iniciar Three.js
    function initThree() {
      clock = new THREE.Clock();
      scene = new THREE.Scene();

      // Distancia de cámara confortable
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 0, 5.2);

      renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        alpha: true,
        antialias: true
      });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.outputEncoding = THREE.sRGBEncoding;

      // Iluminación
      const ambientLight = new THREE.AmbientLight(0xffffff, 2.0);
      scene.add(ambientLight);

      const dirLight1 = new THREE.DirectionalLight(0xfff0dd, 2.6);
      dirLight1.position.set(2, 4, 3);
      scene.add(dirLight1);

      const dirLight2 = new THREE.DirectionalLight(0xffc0cb, 1.4);
      dirLight2.position.set(-2, -1, 2);
      scene.add(dirLight2);

      // Cargar cofre.glb
      const loader = new THREE.GLTFLoader();
      loader.load('./cofre.glb', (gltf) => {
        chestModel = gltf.scene;

        const box = new THREE.Box3().setFromObject(chestModel);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());

        const maxDim = Math.max(size.x, size.y, size.z);
        const targetSize = 1.45;
        const scaleFactor = targetSize / maxDim;

        chestModel.scale.setScalar(scaleFactor);
        
        chestModel.position.x = -center.x * scaleFactor;
        chestModel.position.y = (-center.y * scaleFactor) - 0.45;
        chestModel.position.z = -center.z * scaleFactor;

        chestModel.rotation.x = 0.22;
        chestModel.rotation.y = 0;

        scene.add(chestModel);

        if (gltf.animations && gltf.animations.length > 0) {
          mixer = new THREE.AnimationMixer(chestModel);
          const clip = THREE.AnimationClip.findByName(gltf.animations, 'Scene') || gltf.animations[0];
          const action = mixer.clipAction(clip);
          action.setLoop(THREE.LoopOnce);
          action.clampWhenFinished = true;
          window.chestAction = action;
        }

        loadingScreen.style.opacity = '0';
        setTimeout(() => loadingScreen.style.display = 'none', 400);

      }, (xhr) => {
        if (xhr.lengthComputable) {
          const percent = Math.round((xhr.loaded / xhr.total) * 100);
          loadingTxt.innerText = `Cargando cofre... (${percent}%)`;
        }
      }, (err) => {
        console.error('Error al cargar cofre:', err);
        loadingTxt.innerText = 'Error al cargar el cofre.';
      });

      window.addEventListener('resize', onWindowResize);
      setupTouchControls();
      animate();
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    // Permitir girar manualmente si el usuario lo toca
    let isDragging = false;
    let previousTouchX = 0;

    function setupTouchControls() {
      window.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          isDragging = true;
          previousTouchX = e.touches[0].clientX;
        }
      });

      window.addEventListener('touchmove', (e) => {
        if (isDragging && chestModel && e.touches.length === 1) {
          const deltaX = e.touches[0].clientX - previousTouchX;
          chestModel.rotation.y += deltaX * 0.008;
          previousTouchX = e.touches[0].clientX;
        }
      });

      window.addEventListener('touchend', () => {
        isDragging = false;
      });
    }

    // Animación de renderizado:
    // Balanceo suave sutil de izquierda a derecha (efecto 3D sin dar vueltas)
    let swingTime = 0;
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (mixer) mixer.update(delta);

      if (chestModel) {
        swingTime += delta * 1.5;
        // Solo oscila suavemente entre -8 grados y +8 grados (da relieve 3D sin rotar entero)
        if (!isDragging && !cofreAbierto) {
          chestModel.rotation.y = Math.sin(swingTime) * 0.14;
        }
      }

      renderer.render(scene, camera);
    }

    // Disparar confeti
    function dispararConfeti() {
      const end = Date.now() + (3.5 * 1000);
      const colors = ['#ff4757', '#ff6b81', '#ffd32a', '#ff9ff3', '#ffffff', '#2ed573'];

      (function frame() {
        confetti({
          particleCount: 7,
          angle: 90,
          spread: 70,
          origin: { x: 0.5, y: 0.6 },
          colors: colors
        });
        confetti({
          particleCount: 5,
          angle: 60,
          spread: 55,
          origin: { x: 0.1, y: 0.7 },
          colors: colors
        });
        confetti({
          particleCount: 5,
          angle: 120,
          spread: 55,
          origin: { x: 0.9, y: 0.7 },
          colors: colors
        });

        if (Date.now() < end) {
          requestAnimationFrame(frame);
        }
      }());
    }

    // Botón Abrir Cofre
    btnAbrir.addEventListener('click', () => {
      if (!cofreAbierto) {
        // Fijar de frente exacto para ver la apertura
        if (chestModel) {
          chestModel.rotation.y = 0;
        }

        // Abrir cofre
        if (window.chestAction) {
          window.chestAction.play();
        }

        // Coordinación de salida (a los 1.9 seg cuando la tapa sube)
        setTimeout(() => {
          mensajeFlotante.classList.add('animar');
          dispararConfeti();
        }, 1900);

        // A los 2.8 segundos: Aparece el segundo botón romántico
        setTimeout(() => {
          btnSorpresa.style.display = 'flex';
        }, 2800);

        btnTexto.innerText = "¡Abierto! ❤️";
        btnAbrir.style.background = "linear-gradient(135deg, #10b981 0%, #059669 100%)";
        btnAbrir.style.boxShadow = "0 10px 30px rgba(16, 185, 129, 0.45)";
        cofreAbierto = true;
      } else {
        dispararConfeti();
      }
    });

    startCamera();
    initThree();
  </script>
</body>
</html>
