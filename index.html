<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Nuestra Sorpresa de Aniversario ❤️</title>

  <!-- Google Model-Viewer: El estándar moderno oficial para Realidad Aumentada móvil -->
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.4.0/model-viewer.min.js"></script>
  <!-- Confeti festivo -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Poppins', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at top, #2b1055 0%, #11052C 60%, #000000 100%);
      color: #fff;
    }

    /* Visor 3D y AR a pantalla completa */
    model-viewer {
      width: 100%;
      height: 100%;
      --poster-color: transparent;
      outline: none;
    }

    /* Decoración de fondo de corazones flotantes */
    .bg-particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
      z-index: 1;
    }

    .heart-float {
      position: absolute;
      bottom: -20px;
      font-size: 20px;
      opacity: 0.25;
      animation: floatUp 8s infinite linear;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) rotate(0deg); opacity: 0.25; }
      100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
    }

    /* Encabezado elegante */
    .header-tag {
      position: absolute;
      top: 24px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 8px 24px;
      border-radius: 40px;
      font-size: 14px;
      font-weight: 600;
      color: #ff9ff3;
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      text-align: center;
      letter-spacing: 0.5px;
    }

    /* Controles y tarjetas inferiores */
    .bottom-controls {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      width: 92%;
      max-width: 440px;
      z-index: 20;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    /* Tarjeta del mensaje sorpresa */
    .love-card {
      background: rgba(255, 255, 255, 0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      color: #1f2937;
      padding: 22px 26px;
      border-radius: 26px;
      width: 100%;
      text-align: center;
      box-shadow: 0 20px 45px rgba(255, 71, 87, 0.35), 0 5px 15px rgba(0,0,0,0.2);
      border: 2px solid #ff758c;
      display: none;
      animation: popIn 0.7s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    .love-card h2 {
      color: #ff4757;
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: -0.3px;
    }

    .love-card p {
      font-size: 15px;
      line-height: 1.5;
      color: #4b5563;
      font-weight: 600;
    }

    @keyframes popIn {
      0% { opacity: 0; transform: translateY(30px) scale(0.9); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    /* Grupo de botones */
    .button-group {
      display: flex;
      gap: 12px;
      width: 100%;
      justify-content: center;
    }

    /* Botón Abrir */
    .btn-abrir {
      flex: 1;
      background: linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%);
      color: white;
      border: none;
      padding: 16px 24px;
      font-size: 17px;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(255, 65, 108, 0.45);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .btn-abrir:hover {
      transform: translateY(-2px) scale(1.02);
      box-shadow: 0 14px 34px rgba(255, 65, 108, 0.55);
    }

    .btn-abrir:active {
      transform: translateY(1px) scale(0.98);
    }

    .btn-abrir::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.4) 50%, transparent 60%);
      transform: rotate(45deg);
      animation: shine 3s infinite;
    }

    @keyframes shine {
      0% { transform: translateX(-100%) rotate(45deg); }
      100% { transform: translateX(100%) rotate(45deg); }
    }

    /* Botón de Realidad Aumentada nativa */
    .btn-ar {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.35);
      color: white;
      padding: 16px 20px;
      font-size: 15px;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.25s ease;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .btn-ar:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    /* Banner de ayuda inicial */
    .touch-hint {
      position: absolute;
      top: 75px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(6px);
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 12px;
      color: #e5e7eb;
      pointer-events: none;
      z-index: 5;
    }
  </style>
</head>
<body>

  <!-- Partículas de fondo -->
  <div class="bg-particles" id="bg-particles"></div>

  <!-- Etiqueta superior -->
  <div class="header-tag">✨ Sorpresa de Aniversario ✨</div>

  <div class="touch-hint">👆 Puedes girar y hacer zoom al cofre con los dedos</div>

  <!-- Visor 3D y AR: Sin marcadores raros, con escala y cámara normal -->
  <model-viewer 
    id="visor-cofre"
    src="./cofre.glb" 
    alt="Cofre del Tesoro de Aniversario"
    ar 
    ar-modes="webxr scene-viewer quick-look"
    ar-scale="auto"
    camera-controls 
    shadow-intensity="1.5"
    shadow-softness="0.8"
    camera-orbit="0deg 75deg 105%"
    min-camera-orbit="auto auto 50%"
    max-camera-orbit="auto auto 250%"
    exposure="1.2">
  </model-viewer>

  <!-- Controles Inferiores -->
  <div class="bottom-controls">
    <!-- Tarjeta del mensaje revelado -->
    <div class="love-card" id="love-card">
      <h2>🎉 ¡Feliz Aniversario! 🎉</h2>
      <p>Te amo con todo mi corazón mi amor ❤️<br>¡Gracias por hacerme tan feliz cada día!</p>
    </div>

    <!-- Fila de Botones -->
    <div class="button-group">
      <button class="btn-abrir" id="btn-abrir">
        <span>✨</span>
        <span id="btn-texto">Abrir Cofre</span>
        <span>🔓</span>
      </button>

      <!-- Botón que activa la cámara AR en el suelo/mesa -->
      <button class="btn-ar" id="btn-ar-trigger">
        <span style="font-size: 18px;">📱</span>
        <span>Ver en mi mesa (AR)</span>
      </button>
    </div>
  </div>

  <script>
    const visor = document.getElementById('visor-cofre');
    const btnAbrir = document.getElementById('btn-abrir');
    const btnTexto = document.getElementById('btn-texto');
    const loveCard = document.getElementById('love-card');
    const btnAr = document.getElementById('btn-ar-trigger');

    let cofreAbierto = false;

    // Disparar modo AR nativo al pulsar el botón de cámara
    btnAr.addEventListener('click', () => {
      visor.activateAR();
    });

    // Acción de Abrir Cofre
    btnAbrir.addEventListener('click', () => {
      if (!cofreAbierto) {
        // 1. Mostrar tarjeta con el mensaje de amor
        loveCard.style.display = 'block';

        // 2. Reproducir la animación oficial del cofre ('Scene')
        visor.animationName = 'Scene';
        visor.loop = false;
        visor.play({ repetitions: 1 });

        // 3. Disparar confeti por toda la pantalla
        lanzarConfeti();

        // 4. Transformar botón a estado de celebración
        btnTexto.innerText = "¡Abierto! ❤️";
        btnAbrir.style.background = "linear-gradient(135deg, #10b981 0%, #059669 100%)";
        btnAbrir.style.boxShadow = "0 10px 28px rgba(16, 185, 129, 0.4)";
        cofreAbierto = true;
      } else {
        lanzarConfeti();
      }
    });

    // Confeti festivo
    function lanzarConfeti() {
      const end = Date.now() + (3.5 * 1000);
      const colors = ['#ff4757', '#ff6b81', '#ffd32a', '#ff9ff3', '#ffffff', '#2ed573'];

      (function frame() {
        confetti({
          particleCount: 5,
          angle: 60,
          spread: 55,
          origin: { x: 0 },
          colors: colors
        });
        confetti({
          particleCount: 5,
          angle: 120,
          spread: 55,
          origin: { x: 1 },
          colors: colors
        });

        if (Date.now() < end) {
          requestAnimationFrame(frame);
        }
      }());
    }

    // Decoración de corazones flotantes
    const bgContainer = document.getElementById('bg-particles');
    for (let i = 0; i < 15; i++) {
      const heart = document.createElement('div');
      heart.className = 'heart-float';
      heart.innerText = ['❤️', '💖', '✨', '💕'][Math.floor(Math.random() * 4)];
      heart.style.left = Math.random() * 100 + '%';
      heart.style.animationDelay = (Math.random() * 7) + 's';
      heart.style.animationDuration = (6 + Math.random() * 6) + 's';
      heart.style.fontSize = (16 + Math.random() * 18) + 'px';
      bgContainer.appendChild(heart);
    }
  </script>
</body>
</html>
