<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <script>
    // Garantiza que el móvil cargue siempre la versión más reciente en vivo
    (function() {
      const APP_VERSION = '20261013_v10';
      const storedVer = sessionStorage.getItem('app_version');
      if (storedVer !== APP_VERSION) {
        sessionStorage.setItem('app_version', APP_VERSION);
        if ('caches' in window) {
          caches.keys().then(names => names.forEach(name => caches.delete(name)));
        }
        const url = new URL(window.location.href);
        if (url.searchParams.get('v') !== APP_VERSION) {
          url.searchParams.set('v', APP_VERSION);
          window.location.replace(url.toString());
        }
      }
    })();
  </script>
  <title>Sorpresa de Aniversario ✨</title>

  <!-- Three.js + GLTFLoader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
  <!-- Confeti -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --color-beige-bg: #f9f7f2;
      --color-oliva-suave: #8a9e70;
      --color-oliva-oscuro: #4c5d30;
      --color-dorado: #c5a059;
      --color-dorado-brillo: #e4c88e;
      --color-blanco: #ffffff;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: 'Poppins', system-ui, -apple-system, sans-serif;
      background: transparent;
    }

    /* Video de la cámara de fondo: 100% visible sin pantalla negra */
    #camera-feed {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      object-fit: cover;
      z-index: 1;
      background: #202020;
    }

    /* Canvas 3D transparente */
    #three-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 2;
      pointer-events: auto;
      background: transparent;
    }

    /* Mensaje flotante sin fondo (Emerge de adentro del cofre) */
    .mensaje-flotante-container {
      position: fixed;
      left: 50%;
      transform: translateX(-50%);
      z-index: 25;
      pointer-events: none;
      text-align: center;
      width: 92%;
      max-width: 380px;
      top: 24%;
      display: none;
    }

    .mensaje-flotante-container.animar {
      display: block;
      animation: emergerDelCofre 1.1s cubic-bezier(0.19, 1, 0.22, 1) forwards;
    }

    .texto-titulo {
      font-family: 'Playfair Display', serif;
      font-size: 34px;
      font-weight: 700;
      color: var(--color-blanco);
      text-shadow: 
        0 0 12px rgba(197, 160, 89, 0.9), 
        0 0 25px rgba(138, 158, 112, 0.8), 
        0 3px 8px rgba(0,0,0,0.85);
      letter-spacing: -0.5px;
      line-height: 1.15;
      margin-bottom: 6px;
    }

    .texto-subtitulo {
      font-size: 21px;
      font-weight: 700;
      color: var(--color-dorado-brillo);
      text-shadow: 
        0 0 10px rgba(76, 93, 48, 0.9), 
        0 2px 6px rgba(0,0,0,0.85);
      line-height: 1.3;
    }

    /* Arco de 3 fotos flotantes encima del mensaje */
    .arco-fotos {
      display: flex;
      justify-content: center;
      align-items: flex-end;
      gap: 16px;
      margin-bottom: 14px;
      width: 100%;
    }

    .foto-arco-wrapper {
      position: relative;
      transition: transform 0.3s ease;
    }

    /* Estilo marco polaroid mini con ribete dorado */
    .foto-arco {
      width: 82px;
      height: 98px;
      background: #ffffff;
      padding: 5px 5px 12px 5px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.45), 0 0 14px rgba(197, 160, 89, 0.5);
      border: 1.5px solid var(--color-dorado);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .foto-arco img {
      width: 100%;
      height: 72px;
      object-fit: cover;
      border-radius: 7px;
    }

    /* Disposición geométrica en ARCO: la izquierda gira a la izq, la del centro sube, la derecha gira a la der */
    .foto-arco-izq {
      transform: translateY(14px) rotate(-16deg);
    }

    .foto-arco-centro {
      transform: translateY(-8px) scale(1.12);
      z-index: 2;
    }

    .foto-arco-der {
      transform: translateY(14px) rotate(16deg);
    }

    @keyframes emergerDelCofre {
      0% {
        opacity: 0;
        transform: translate(-50%, 60px) scale(0.25);
      }
      60% {
        opacity: 1;
        transform: translate(-50%, -12px) scale(1.05);
      }
      100% {
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
      }
    }

    /* Botones Inferiores */
    .bottom-ui {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 30;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 92%;
      max-width: 400px;
    }

    /* Botón Abrir: Se muestra ÚNICAMENTE después del giro inicial de 3 segundos */
    .btn-abrir {
      background: linear-gradient(135deg, var(--color-oliva-suave) 0%, var(--color-oliva-oscuro) 100%);
      color: var(--color-blanco);
      border: 2px solid var(--color-dorado-brillo);
      padding: 17px 44px;
      font-size: 19px;
      font-weight: 700;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 10px 28px rgba(76, 93, 48, 0.55), 0 0 15px rgba(228, 200, 142, 0.4);
      display: none; /* Oculto al inicio mientras gira */
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
      width: 100%;
      animation: aparecerBoton 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
    }

    @keyframes aparecerBoton {
      0% { opacity: 0; transform: translateY(25px) scale(0.9); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .btn-abrir:active {
      transform: scale(0.97);
    }

    .btn-abrir::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent 40%, rgba(255,255,255,0.4) 50%, transparent 60%);
      transform: rotate(45deg);
      animation: brillo 3s infinite;
    }

    @keyframes brillo {
      0% { transform: translateX(-100%) rotate(45deg); }
      100% { transform: translateX(100%) rotate(45deg); }
    }

    /* Segundo Botón Sorpresa: Llamativo y Romántico con Brillo Dorado */
    .btn-sorpresa {
      background: linear-gradient(135deg, #ffffff 0%, #fdfbf7 100%);
      color: var(--color-oliva-oscuro);
      border: 2.5px solid var(--color-dorado);
      padding: 18px 24px;
      font-size: 16px;
      font-weight: 800;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 
        0 14px 35px rgba(0, 0, 0, 0.35), 
        0 0 25px rgba(197, 160, 89, 0.6),
        inset 0 1px 0 rgba(255,255,255,1);
      display: none;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      text-decoration: none;
      letter-spacing: 0.3px;
      animation: popInBounce 0.9s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards, latidoDorado 2.2s infinite ease-in-out 1s;
      position: relative;
      overflow: hidden;
    }

    @keyframes popInBounce {
      0% { opacity: 0; transform: translateY(30px) scale(0.8); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes latidoDorado {
      0%, 100% { box-shadow: 0 14px 35px rgba(0, 0, 0, 0.35), 0 0 20px rgba(197, 160, 89, 0.5); transform: scale(1); }
      50% { box-shadow: 0 18px 40px rgba(0, 0, 0, 0.4), 0 0 35px rgba(197, 160, 89, 0.9); transform: scale(1.025); }
    }

    /* Pantalla de carga / Permiso de cámara */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: #f9f7f2;
      z-index: 999;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: var(--color-oliva-oscuro);
      padding: 24px;
      text-align: center;
      transition: opacity 0.5s ease;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid rgba(138, 158, 112, 0.2);
      border-top-color: var(--color-oliva-oscuro);
      border-radius: 50%;
      animation: spin 1s infinite linear;
      margin-bottom: 16px;
    }

    @keyframes spin {
      100% { transform: rotate(360deg); }
    }

    .btn-permiso-camara {
      margin-top: 18px;
      background: var(--color-oliva-suave);
      color: white;
      border: none;
      padding: 12px 28px;
      border-radius: 30px;
      font-weight: 600;
      font-size: 15px;
      cursor: pointer;
      display: none;
    }
  </style>
</head>
<body>

  <!-- Pantalla de carga -->
  <div id="loading" class="loading-overlay">
    <div class="spinner"></div>
    <p id="loading-txt" style="font-weight: 600; font-size: 16px;">Solo espere...</p>
    <button id="btn-permiso" class="btn-permiso-camara" onclick="iniciarCamaraManual()">📷 Activar Cámara</button>
  </div>

  <!-- Video real de la cámara trasera -->
  <video id="camera-feed" autoplay playsinline muted></video>

  <!-- Canvas 3D -->
  <canvas id="three-canvas"></canvas>

  <!-- Mensaje flotante sin fondo emergente con fotos en ARCO encima -->
  <div class="mensaje-flotante-container" id="mensaje-flotante">
    <!-- Arco de 3 fotos de nosotros -->
    <div class="arco-fotos">
      <div class="foto-arco-wrapper foto-arco-izq">
        <div class="foto-arco">
          <img src="./fotos/cada_momento.jpg" alt="Nosotros">
        </div>
      </div>
      <div class="foto-arco-wrapper foto-arco-centro">
        <div class="foto-arco">
          <img src="./fotos/risas_alma.jpg" alt="Amor">
        </div>
      </div>
      <div class="foto-arco-wrapper foto-arco-der">
        <div class="foto-arco">
          <img src="./fotos/tu_sonrisa.jpg" alt="Juntos">
        </div>
      </div>
    </div>

    <div class="texto-titulo">¡Feliz Aniversario!</div>
    <div class="texto-subtitulo">Te amo mucho ❤️</div>
  </div>

  <!-- Botones Inferiores -->
  <div class="bottom-ui">
    <!-- Botón Abrir Cofre (Aparece tras el giro inicial de 3s) -->
    <button class="btn-abrir" id="btn-abrir">
      <span>✨</span>
      <span>Abrir Cofre</span>
      <span>🔓</span>
    </button>

    <!-- Segundo Botón Sorpresa (Aparece 3 segundos después de que el cofre se abre) -->
    <a href="./carta.html" class="btn-sorpresa" id="btn-sorpresa">
      <span>💌</span>
      <span>Esto no es todo mi amor, otro pequeño detalle...</span>
      <span>✨</span>
    </a>
  </div>

  <script>
    const loadingScreen = document.getElementById('loading');
    const loadingTxt = document.getElementById('loading-txt');
    const btnPermiso = document.getElementById('btn-permiso');
    const video = document.getElementById('camera-feed');
    const canvas = document.getElementById('three-canvas');
    const btnAbrir = document.getElementById('btn-abrir');
    const btnSorpresa = document.getElementById('btn-sorpresa');
    const mensajeFlotante = document.getElementById('mensaje-flotante');

    let scene, camera, renderer, mixer, clock, chestModel;
    let cofreAbierto = false;
    let camaraIniciada = false;

    // Estados del giro inicial de 3 segundos
    let initialSpinning = false;
    let initialSpinStartTime = 0;
    const SPIN_DURATION = 3000; // 3 segundos exactos

    // 1. Iniciar cámara trasera
    async function startCamera() {
      if (camaraIniciada) return;
      try {
        const constraints = {
          video: {
            facingMode: { ideal: 'environment' },
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        };

        const stream = await navigator.mediaDevices.getUserMedia(constraints);
        video.srcObject = stream;
        video.setAttribute('playsinline', 'true');
        video.setAttribute('webkit-playsinline', 'true');
        await video.play();
        camaraIniciada = true;
      } catch (err) {
        console.warn('Error al iniciar cámara automáticamente:', err);
        loadingTxt.innerText = "Toca para permitir acceso a la cámara:";
        btnPermiso.style.display = 'block';
      }
    }

    async function iniciarCamaraManual() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment' }
        });
        video.srcObject = stream;
        video.setAttribute('playsinline', 'true');
        await video.play();
        camaraIniciada = true;
        btnPermiso.style.display = 'none';
        loadingTxt.innerText = "Cámara activada con éxito.";
      } catch (e) {
        alert("Por favor permite el acceso a la cámara para ver la Realidad Aumentada.");
      }
    }

    // 2. Iniciar Three.js
    function initThree() {
      clock = new THREE.Clock();
      scene = new THREE.Scene();

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
      camera.position.set(0, 0, 5.2);

      renderer = new THREE.WebGLRenderer({
        canvas: canvas,
        alpha: true,
        antialias: true
      });
      renderer.setClearColor(0x000000, 0);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.outputEncoding = THREE.sRGBEncoding;

      // Iluminación cálida dorada
      const ambientLight = new THREE.AmbientLight(0xfff7e6, 2.2);
      scene.add(ambientLight);

      const dirLight1 = new THREE.DirectionalLight(0xfff3db, 2.5);
      dirLight1.position.set(2, 4, 3);
      scene.add(dirLight1);

      const dirLight2 = new THREE.DirectionalLight(0xe4c88e, 1.4);
      dirLight2.position.set(-2, -1, 2);
      scene.add(dirLight2);

      // Cargar cofre.glb
      const loader = new THREE.GLTFLoader();
      loader.load('./cofre.glb', (gltf) => {
        chestModel = gltf.scene;

        const box = new THREE.Box3().setFromObject(chestModel);
        const center = box.getCenter(new THREE.Vector3());
        const size = box.getSize(new THREE.Vector3());

        const maxDim = Math.max(size.x, size.y, size.z);
        const targetSize = 1.45;
        const scaleFactor = targetSize / maxDim;

        chestModel.scale.setScalar(scaleFactor);
        
        chestModel.position.x = -center.x * scaleFactor;
        chestModel.position.y = (-center.y * scaleFactor) - 0.45;
        chestModel.position.z = -center.z * scaleFactor;

        chestModel.rotation.x = 0.22;
        chestModel.rotation.y = 0;

        scene.add(chestModel);

        if (gltf.animations && gltf.animations.length > 0) {
          mixer = new THREE.AnimationMixer(chestModel);
          const clip = THREE.AnimationClip.findByName(gltf.animations, 'Scene') || gltf.animations[0];
          const action = mixer.clipAction(clip);
          action.setLoop(THREE.LoopOnce);
          // IMPORTANTE: clampWhenFinished para que el cofre quede permanentemente ABIERTO
          action.clampWhenFinished = true;
          // Velocidad rápida
          action.timeScale = 2.2;
          window.chestAction = action;
        }

        // Ocultar pantalla de carga e INICIAR EL GIRO DE PRESENTACIÓN DE 3 SEGUNDOS
        setTimeout(() => {
          loadingScreen.style.opacity = '0';
          setTimeout(() => {
            loadingScreen.style.display = 'none';
            // Arrancar giro de 3 segundos
            initialSpinning = true;
            initialSpinStartTime = performance.now();
          }, 450);
        }, 500);

      }, (xhr) => {
        // Mantiene texto limpio y discreto
        loadingTxt.innerText = 'Solo espere...';
      }, (err) => {
        console.error('Error al cargar cofre:', err);
      });

      window.addEventListener('resize', onWindowResize);
      setupTouchControls();
      animate();
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    let isDragging = false;
    let previousTouchX = 0;

    function setupTouchControls() {
      window.addEventListener('touchstart', (e) => {
        if (e.touches.length === 1) {
          isDragging = true;
          previousTouchX = e.touches[0].clientX;
        }
      });

      window.addEventListener('touchmove', (e) => {
        if (isDragging && chestModel && e.touches.length === 1 && !initialSpinning) {
          const deltaX = e.touches[0].clientX - previousTouchX;
          chestModel.rotation.y += deltaX * 0.008;
          previousTouchX = e.touches[0].clientX;
        }
      });

      window.addEventListener('touchend', () => {
        isDragging = false;
      });
    }

    // Bucle de Renderizado
    let swingTime = 0;
    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();
      if (mixer) mixer.update(delta);

      if (chestModel) {
        if (initialSpinning) {
          const elapsed = performance.now() - initialSpinStartTime;
          const progress = Math.min(elapsed / SPIN_DURATION, 1);

          // Easing suave para dar exactamente una vuelta completa (2 * PI) en 3 segundos
          // Función de desaceleración armónica
          chestModel.rotation.y = (Math.PI * 2) * easeInOutQuad(progress);

          if (progress >= 1) {
            initialSpinning = false;
            chestModel.rotation.y = 0; // Frente perfecto
            // Mostrar botón "Abrir Cofre" después del giro de 3s
            btnAbrir.style.display = 'flex';
          }
        } else if (!isDragging && !cofreAbierto) {
          // Balanceo 3D sutil para dar volumen antes de abrir
          swingTime += delta * 1.5;
          chestModel.rotation.y = Math.sin(swingTime) * 0.12;
        }
      }

      renderer.render(scene, camera);
    }

    function easeInOutQuad(t) {
      return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
    }

    // Confeti
    function dispararConfeti() {
      const end = Date.now() + (3.2 * 1000);
      const colors = ['#c5a059', '#e4c88e', '#8a9e70', '#ffffff', '#e8d5b5'];

      (function frame() {
        confetti({
          particleCount: 7,
          angle: 90,
          spread: 70,
          origin: { x: 0.5, y: 0.6 },
          colors: colors
        });
        confetti({
          particleCount: 5,
          angle: 60,
          spread: 55,
          origin: { x: 0.1, y: 0.7 },
          colors: colors
        });
        confetti({
          particleCount: 5,
          angle: 120,
          spread: 55,
          origin: { x: 0.9, y: 0.7 },
          colors: colors
        });

        if (Date.now() < end) {
          requestAnimationFrame(frame);
        }
      }());
    }

    // Botón Abrir Cofre
    btnAbrir.addEventListener('click', () => {
      if (!cofreAbierto) {
        cofreAbierto = true;

        if (chestModel) {
          chestModel.rotation.y = 0; // Mirando de frente
        }

        // 1. Abrir con velocidad rápida y mantener permanentemente abierto
        if (window.chestAction) {
          window.chestAction.reset();
          window.chestAction.play();
        }

        // Cuando la animación llega al final, congelamos el mixer para que jamás se cierre
        mixer.addEventListener('finished', (e) => {
          if (window.chestAction) {
            window.chestAction.paused = true; // Congelado 100% abierto
          }
        });

        // 2. Ocultar botón "Abrir Cofre"
        btnAbrir.style.display = 'none';

        // 3. A los 850ms (cuando se levanta la tapa): emerge el mensaje y confeti
        setTimeout(() => {
          mensajeFlotante.classList.add('animar');
          dispararConfeti();
        }, 850);

        // 4. A los 4 segundos (1 segundo más de duración solicitado): aparece el botón sorpresa
        setTimeout(() => {
          btnSorpresa.style.display = 'flex';
        }, 4000);
      }
    });

    startCamera();
    initThree();
  </script>
</body>
</html>
